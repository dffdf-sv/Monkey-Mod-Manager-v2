name: Build ModHub Native (Rust)
on:
  push:
    branches: [rust-native]
    paths: ["native/**", ".github/workflows/rust-native.yml"]
  pull_request:
    paths: ["native/**", ".github/workflows/rust-native.yml"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Windows
        working-directory: native
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: ModHub-Windows
          path: native/target/release/modhub-native.exe

  linux-appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build and packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-xkb-dev libxkbcommon-x11-dev imagemagick file
      - name: Build native binary
        working-directory: native
        run: cargo build --release
      - name: Create AppDir structure
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp native/target/release/modhub-native AppDir/usr/bin/modhub-native
          convert public/image.jpg -resize 256x256 AppDir/usr/share/icons/hicolor/256x256/apps/modhub.png
          cat > AppDir/modhub.desktop <<'EOF'
          [Desktop Entry]
          Name=ModHub
          Comment=Native Gorilla Tag mod manager
          Exec=modhub-native
          Icon=modhub
          Type=Application
          Categories=Game;Utility;
          Terminal=false
          EOF
          cp AppDir/modhub.desktop AppDir/usr/share/applications/modhub.desktop
          cp AppDir/usr/share/icons/hicolor/256x256/apps/modhub.png AppDir/modhub.png
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export PATH="$HERE/usr/bin:$PATH"
          exec "$HERE/usr/bin/modhub-native" "$@"
          EOF
          chmod +x AppDir/AppRun
      - name: Download linuxdeploy AppImage
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy.AppImage
          chmod +x linuxdeploy.AppImage
      - name: Package single-file AppImage
        run: |
          ./linuxdeploy.AppImage --appimage-extract-and-run --appdir AppDir --output appimage
          mv ModHub-x86_64.AppImage ModHub-Linux-x86_64.AppImage
          file ModHub-Linux-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: ModHub-Linux-AppImage
          path: ModHub-Linux-x86_64.AppImage
