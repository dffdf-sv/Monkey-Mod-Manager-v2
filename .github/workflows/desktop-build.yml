name: Build and publish desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (examples v2, v2.0, v2.0.1, v2.0.1.4)
        required: true
        default: "v2.0.1"
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Normalize version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          $version = $env:INPUT_VERSION -replace '^v', ''
          if ($version -notmatch '^\d+(\.\d+)*$') {
            throw "Invalid version: $env:INPUT_VERSION. Use v2, v2.0, v2.0.1, or any dot-separated numeric version."
          }
          $parts = @($version.Split('.'))
          while ($parts.Count -lt 3) { $parts += '0' }
          if ($parts.Count -gt 3) {
            $suffix = $parts[3..($parts.Count - 1)] -join '.'
            $packageVersion = "$($parts[0]).$($parts[1]).$($parts[2])-$suffix"
          } else {
            $packageVersion = $parts -join '.'
          }
          Write-Host "Release version: v$version; package version: $packageVersion"
          npm pkg set "version=$packageVersion"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build and publish Windows installer + update metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build && npx electron-builder --win nsis --publish always
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Monkey-Mod-Manager-Windows
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: Build and publish Linux packages
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Normalize version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          VERSION="${INPUT_VERSION#v}"
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]] || { echo "Invalid version: $INPUT_VERSION. Use v2, v2.0, v2.0.1, or any dot-separated numeric version."; exit 1; }
          IFS='.' read -r -a PARTS <<< "$VERSION"
          while (( ${#PARTS[@]} < 3 )); do PARTS+=(0); done
          if (( ${#PARTS[@]} > 3 )); then
            EXTRA="$(IFS='.'; echo "${PARTS[*]:3}")"
            PACKAGE_VERSION="${PARTS[0]}.${PARTS[1]}.${PARTS[2]}-$EXTRA"
          else
            PACKAGE_VERSION="${PARTS[0]}.${PARTS[1]}.${PARTS[2]}"
          fi
          echo "Release version: v$VERSION; package version: $PACKAGE_VERSION"
          npm pkg set "version=$PACKAGE_VERSION"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build and publish Linux packages + update metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build && npx electron-builder --linux AppImage deb --publish always
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: Monkey-Mod-Manager-Linux
          path: |
            release/*.AppImage
            release/*.deb
            release/latest-linux.yml
          if-no-files-found: error
          retention-days: 14

