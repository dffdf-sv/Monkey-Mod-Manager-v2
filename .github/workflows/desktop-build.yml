name: Build and publish desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version number (for example 2.0.1)
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set release version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            $version = "${{ github.ref_name }}".TrimStart("v")
          }
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') { throw "Invalid version: $version" }
          npm version $version --no-git-tag-version
      - name: Install dependencies
        run: npm install
      - name: Build installer
        run: npm run dist:win
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Monkey-Mod-Manager-Windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 7

  build-linux:
    name: Build Linux packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set release version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]] || { echo "Invalid version: $VERSION"; exit 1; }
          npm version "$VERSION" --no-git-tag-version
      - name: Install dependencies
        run: npm install
      - name: Build Linux packages
        run: npm run dist:linux
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: Monkey-Mod-Manager-Linux
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish numbered GitHub release
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-linux
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: Monkey-Mod-Manager-Windows
          path: release-files
      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          name: Monkey-Mod-Manager-Linux
          path: release-files
      - name: Publish release with installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          target_commitish: main
          name: Monkey Mod Manager ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          generate_release_notes: true
          files: |
            release-files/*.exe
            release-files/*.AppImage
            release-files/*.deb
