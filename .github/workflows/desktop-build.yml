name: Build and publish desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (use vMAJOR.MINOR.PATCH, e.g. v2.0.2)
        required: true
        default: "v2.0.2"
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Resolve and validate version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          VERSION="${INPUT_VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '$INPUT_VERSION'. Use vMAJOR.MINOR.PATCH, for example v2.0.2."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            ASSET_COUNT=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')
            if [[ "$ASSET_COUNT" -gt 0 ]]; then
              echo "::error::Release $RELEASE_TAG already has assets. Choose a new version instead of overwriting a published release."
              exit 1
            fi
            echo "Found an empty release from an earlier failed build; continuing."
          else
            gh release create "$RELEASE_TAG" --title "Monkey Mod Manager $RELEASE_TAG" --generate-notes --target main
          fi

  build-windows:
    name: Build Windows x64 installer
    needs: prepare-release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set package version
        run: npm pkg set "version=${{ needs.prepare-release.outputs.version }}"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build and publish Windows installer + updater metadata
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build && npx electron-builder --win nsis --x64 --publish always
      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Monkey-Mod-Manager-Windows
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: Build Linux x64 packages
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set package version
        run: npm pkg set "version=${{ needs.prepare-release.outputs.version }}"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build and publish Linux packages + updater metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build && npx electron-builder --linux AppImage deb --x64 --publish always
      - name: Upload Linux build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Monkey-Mod-Manager-Linux
          path: |
            release/*.AppImage
            release/*.deb
            release/latest-linux.yml
          if-no-files-found: error
          retention-days: 14
