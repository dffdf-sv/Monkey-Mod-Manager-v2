name: Build and publish desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (examples: v2, v2.0, v2.0.1, v2.0.1.4)
        required: true
        default: "v2.0.1"
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set release version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            $version = "${{ github.ref_name }}"
          }
          $version = $version -replace '^v', ''
          if ($version -notmatch '^\d+(\.\d+)*$') {
            throw "Invalid version: $version. Use v2, v2.0, v2.0.1, or any dot-separated numeric version."
          }
          $parts = @($version.Split('.'))
          while ($parts.Count -lt 3) { $parts += '0' }
          if ($parts.Count -gt 3) {
            $npmVersion = "$($parts[0]).$($parts[1]).$($parts[2])-$($parts[3..($parts.Count - 1)] -join '.')"
          } else {
            $npmVersion = $parts -join '.'
          }
          Write-Host "Release version: v$version; package version: $npmVersion"
          npm pkg set "version=$npmVersion"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Windows installer
        run: npm run dist:win
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Monkey-Mod-Manager-Windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: Build Linux packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set release version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="$GITHUB_REF_NAME"
          fi
          VERSION="${VERSION#v}"
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]] || { echo "Invalid version: $VERSION. Use v2, v2.0, v2.0.1, or any dot-separated numeric version."; exit 1; }
          IFS='.' read -r -a PARTS <<< "$VERSION"
          while (( ${#PARTS[@]} < 3 )); do PARTS+=(0); done
          if (( ${#PARTS[@]} > 3 )); then
            EXTRA="$(IFS='.'; echo "${PARTS[*]:3}")"
            PACKAGE_VERSION="${PARTS[0]}.${PARTS[1]}.${PARTS[2]}-$EXTRA"
          else
            PACKAGE_VERSION="${PARTS[0]}.${PARTS[1]}.${PARTS[2]}"
          fi
          echo "Release version: v$VERSION; package version: $PACKAGE_VERSION"
          npm pkg set "version=$PACKAGE_VERSION"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Linux packages
        run: npm run dist:linux
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: Monkey-Mod-Manager-Linux
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish direct downloads to GitHub Releases
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-linux
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: Monkey-Mod-Manager-Windows
          path: release-files
          merge-multiple: true
      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          name: Monkey-Mod-Manager-Linux
          path: release-files
          merge-multiple: true
      - name: Set release tag
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="$GITHUB_REF_NAME"
          fi
          VERSION="${VERSION#v}"
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]] || { echo "Invalid release version: $VERSION"; exit 1; }
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=Monkey Mod Manager v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Publish direct installer files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: main
          name: ${{ steps.release.outputs.name }}
          generate_release_notes: true
          files: |
            release-files/*.exe
            release-files/*.AppImage
            release-files/*.deb
