name: Check ModHub desktop build

on:
  push:
    branches: [rust-native]
    paths:
      - "src/**"
      - "electron/**"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "vite.config.*"
      - ".github/workflows/desktop-check.yml"
  pull_request:
    paths:
      - "src/**"
      - "electron/**"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "vite.config.*"
      - ".github/workflows/desktop-check.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type-check and build renderer
        run: npm run build
      - name: Verify Electron main and preload syntax
        run: |
          node --check electron/main.cjs
          node --check electron/preload.cjs
