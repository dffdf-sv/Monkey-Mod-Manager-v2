[package]
name = "modhub-native"
version = "1.0.0"
edition = "2021"
description = "Native Rust desktop mod manager for Gorilla Tag"
license = "MIT"

[dependencies]
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui = "0.29"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
zip = "2"
